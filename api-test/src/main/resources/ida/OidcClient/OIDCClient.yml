CreateOIDCClient:
   auth_CreateOIDCClient_Delegated_Valid_Smoke_sid:
      endPoint: /v1/partnermanager/oidc/client
      uniqueIdentifier: TC_PMS_CreateOIDCClient_Delegated_01
      description: Verify that OIDC client creation succeeds for a valid delegated partner
      role: partner
      restMethod: post
      inputTemplate: ida/OidcClient/OIDCClient
      outputTemplate: ida/OidcClient/OIDCClientResult
      input: '{
        "name": "$RANDOMID$",
        "policyId": "$POLICYID_FOR_DELEGATED$",
        "publicKey": "$OIDCJWKKEY3$",
        "authPartnerId": "$PARTNER_ID_FOR_DELEGATED$",
        "logoUri": "https://health-services.com/logo.png",
        "redirectUris": "$IDPREDIRECTURI$",
        "grantTypes": "authorization_code",
        "clientAuthMethods": "private_key_jwt"
}'
      output: '{
        "status": "ACTIVE"
}'