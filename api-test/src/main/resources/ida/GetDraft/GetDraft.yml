GetDraft:
  auth_GetDraft_all_valid_smoke_sid:
      endPoint: /idrepository/v1/identity/draft/{registrationId}
      uniqueIdentifier: TC_IDA_GetDraft_01
      description: Verify that fetching draft details succeeds when all required fields are valid and a valid SID is provided
      role: idrepo
      restMethod: get
      inputTemplate: ida/GetDraft/getDraft
      outputTemplate: ida/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RID$"
      }'
      output: '{
      "status": "DRAFT"
}'
  auth_GetDraft_audit_valid_smoke_sid:
      endPoint: /idrepository/v1/identity/draft/{registrationId}
      uniqueIdentifier: TC_IDA_dependentTC_AuthTransaction_GetDraft_02
      description: Verify that fetching draft details succeeds for a valid SID and the get-draft action is correctly recorded in the audit log
      role: idrepo
      restMethod: get
      inputTemplate: ida/GetDraft/getDraft
      outputTemplate: ida/GetDraft/getDraftResult
      input: '{
      "registrationId":"$RID1$"
      }'
      output: '{
      "status": "DRAFT"
}'