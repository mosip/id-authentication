CreateVID:
  auth_GenerateVID_All_Valid_Smoke_Perpetual_sid:
      endPoint: /idrepository/v1/vid
      uniqueIdentifier: TC_IDA_CreateVID_01
      description: Verify that a VID is successfully generated with all valid inputs for a perpetual duration when SID is provided
      role: idrepo
      restMethod: post
      inputTemplate: ida/CreateVID/createVid
      outputTemplate: ida/CreateVID/createVidResult
      input: '{
    "vidType": "Perpetual",
    "UIN": "$ID:AddIdentity_ValidParam_smoke_Pos_UIN$",
    "version": "v1",
    "id": "mosip.vid.create",
    "requesttime": "$TIMESTAMP$"
}'
      output: '{
  "vidStatus":"ACTIVE"
}'

  auth_GenerateVID_to_revoke_Perpetual_sid:
