HotlistAPI:
   auth_HotlistAPI_All_Valid_Smoke_sid:
      endPoint: /v1/hotlist/unblock
      uniqueIdentifier: TC_IDA_HotlistAPI_Unblock_08
      description: Verify that the Hotlist API succeeds when all inputs are valid with a session ID provided
      role: hotlist
      restMethod: post
      additionalDependencies: TC_IDA_HotlistAPI_15
      inputTemplate: ida/UnBlockHotlistAPI/UnblockHotlistAPI
      outputTemplate: ida/UnBlockHotlistAPI/UnblockHotlistAPIResult
      input: '{
    "id": "$BLOCKEDPARTNERID$",
    "idType": "PARTNER_ID",
    "requestTime": "$TIMESTAMP$",
    "expiryTimestamp": ""
  }'
      output: '{
        "status": "UNBLOCKED"
    }'
