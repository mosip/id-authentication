# LOCAL RUN ONLY -- referenced by testNgXmlFiles/authLocalSuite.xml and by no
# environment suite (env runs keep ida/UpdateIdentityForUin/UpdateIdentity.yml: PATCH /idrepository/v1/identity/ built from the ID schema).
# The local WireMock stub (master-data.json) takes a plain PATCH and sends IDA the
# matching event, so these replicas post directly: no send-OTP step and no OTP.
UpdateIdentityForUinLocal:
   auth_UpdateIdentityForUinLocal_DEACTIVATE_smoke:
      endPoint: /idrepository/v1/identity/
      uniqueIdentifier: TC_IDA_UpdateIdentityForUinLocal_01
      description: Verify that a UIN is deactivated (local-run replica of TC_IDA_UpdateIdentityForUin_01)
      role: idrepo
      restMethod: patch
      inputTemplate: ida/LocalMockRequests/updateIdentityLocal
      outputTemplate: ida/LocalMockRequests/updateIdentityLocalResult
      input: '{
        "id": "mosip.id.update",
        "version": "v1",
        "requesttime": "$TIMESTAMP$",
        "registrationId": "$RID$",
        "status": "DEACTIVATED",
        "IDSchemaVersion": "0.4",
        "email": "$ID:AddIdentity_deactivate_UIN_smoke_sid_Pos_EMAIL$",
        "dateOfBirth": "1970/07/08",
        "UIN": "$ID:LocalMock_identityStub_UIN$"
    }'
      output: '{
        "status": "DEACTIVATED"
}'
   auth_UpdateIdentityForUinLocal_DEACTIVATE_toSendOtp_smoke:
      endPoint: /idrepository/v1/identity/
      uniqueIdentifier: TC_IDA_UpdateIdentityForUinLocal_02
      description: Verify that a UIN is deactivated (local-run replica of TC_IDA_UpdateIdentityForUin_02)
      role: idrepo
      restMethod: patch
      inputTemplate: ida/LocalMockRequests/updateIdentityLocal
      outputTemplate: ida/LocalMockRequests/updateIdentityLocalResult
      input: '{
        "id": "mosip.id.update",
        "version": "v1",
        "requesttime": "$TIMESTAMP$",
        "registrationId": "$RID$",
        "status": "DEACTIVATED",
        "IDSchemaVersion": "0.4",
        "email": "$ID:AddIdentity_ValidParameters_toCreateVid_deactivateUIN_toSendOtp_smoke_Pos_EMAIL$",
        "dateOfBirth": "1970/07/08",
        "UIN": "$ID:LocalMock_identityStub_UIN$"
    }'
      output: '{
        "status": "DEACTIVATED"
}'
   auth_UpdateIdentityForUinLocal_DEACTIVATE_toReactivate_smoke:
      endPoint: /idrepository/v1/identity/
      uniqueIdentifier: TC_IDA_UpdateIdentityForUinLocal_03
      description: Verify that a UIN is deactivated before it is reactivated (local-run replica of TC_IDA_UpdateIdentityForUin_03)
      role: idrepo
      restMethod: patch
      inputTemplate: ida/LocalMockRequests/updateIdentityLocal
      outputTemplate: ida/LocalMockRequests/updateIdentityLocalResult
      input: '{
        "id": "mosip.id.update",
        "version": "v1",
        "requesttime": "$TIMESTAMP$",
        "registrationId": "$RID$",
        "status": "DEACTIVATED",
        "IDSchemaVersion": "0.4",
        "email": "$ID:AddIdentity_ValidParameters_toDeactivate_ReactivateUIN_smoke_Pos_EMAIL$",
        "dateOfBirth": "1970/07/08",
        "UIN": "$ID:LocalMock_identityStub_UIN$"
    }'
      output: '{
        "status": "DEACTIVATED"
}'
