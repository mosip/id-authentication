AuthLockNew:
   auth_AuthLockNew_Valid_UIN_All:
      endPoint: /resident/v1/auth-lock-unlock
      uniqueIdentifier: TC_IDA_AuthLockNew_01
      description: Validate locking demo and bio-FACE for a valid UIN (local-run replica of TC_IDA_AuthLock_01, which uses the deprecated resident API)
      role: resident
      restMethod: post
      inputTemplate: ida/AuthLockUnlockNew/AuthLockUnlockNew
      outputTemplate: ida/AuthLockUnlockNew/AuthLockUnlockNewResult
      input: '{
        "id": "mosip.resident.auth.lock.unlock",
        "version": "v1",
        "requesttime": "$TIMESTAMP$",
        "authTypes": [{"authType": "Demo", "locked": "true", "unlockForSeconds": "null"}, {"authType": "bio", "authSubType": "face", "locked": "true", "unlockForSeconds": "null"}]
    }'
      output: '{
        "status": "Success"
}'
