#=============================================================================#
#  SEEDED PREREQUISITE IDS  --  local run mode only                            #
#-----------------------------------------------------------------------------#
#  Replaces authPrerequisiteSuite.xml (22 tests against idrepo / resident /    #
#  idgenerator). LocalRunBootstrap loads each entry into                       #
#  AdminTestUtil.autoGeneratedIDValueCache -- the same cache a prerequisite     #
#  test would have written to -- so downstream $ID:<key>$ placeholders resolve  #
#  unchanged.                                                                  #
#                                                                              #
#  KEY FORMAT (see AdminTestUtil.getAutogenIdKeyName)                          #
#    <testCaseName with everything up to the first underscore removed>_<field>  #
#                                                                              #
#  KEEP IN SYNC WITH: local-dev-setup/docker-compose/init.sql                  #
#    UIN 8952059168 is the identity seeded into ida.identity_cache. Only UINs   #
#    with a matching ida.uin_hash_salt row authenticate, so it cannot be        #
#    changed arbitrarily. Email/phone mirror IDA-sample-client/samples/         #
#    auth-req-01.json.                                                         #
#                                                                              #
#  NOT SEEDED (left out deliberately, so dependent tests skip rather than fail) #
#    *_vid      : the local stack seeds no VID; VID creation needs idrepo /     #
#                 resident, neither of which runs locally.                      #
#    *_authToken: produced by the DemoAuth tests themselves during the run.     #
#                                                                              #
#  AUTH LOCK IDENTITY                                                          #
#    8354720784 (VID 8420394176306134) is the one identity the local auth       #
#    lock/unlock mock acts on (wiremock master-data.json, PR #1801). Every key  #
#    whose tests expect a lock set by the deprecated AuthLock tests points at   #
#    it: Lock_UIN_Unlock_DemoAuth_* and Lock_permanent_DemoAuth_* /            #
#    Lock_permanent_BioAuth_* (env sets those locks through AuthInternalLock,   #
#    which is not mocked; the Phase 0b lock leaves demo and face locked until   #
#    the Phase 5 unlock), authLock_Face/bioIris, toLock_phoneAndEmail.          #
#    toLock_email / toLock_phone are on John (8952059168, no locks): their only  #
#    local consumers, OtpAuth_30/31, send OTP on both channels and expect       #
#    success, which one identity with both channels locked cannot give.        #
#    Lock_UIN_Unlock_BioAuth_* stays on Sanjay: many                           #
#    face-auth success tests share it.                                          #
#=============================================================================#

