# Every DeviceInfo.json under "Biometric Devices" declares env "Staging", while
# MDSClient historically hardcoded "Developer".
mdsCaptureEnv = Staging

# "Automatic" makes the SBI read seed-indexed samples (0001Face.iso) from
# resource/Profile/Automatic/<purpose>/, matching the
# mosip.mock.sbi.biometric.*.seed.* values. "Default" reads plain Face.iso.
mdsCaptureProfile = Default

# The seeded identity's fingers are enrolled as WSQ (Left_Index_wsq.iso etc.),
# and the mock SDK compares finger templates byte for byte, so a JP2000 capture
# never matches. Needs mock-mds 1.4.0-SNAPSHOT (CentralizedMockSBI.startSBIV1).
mdsImageType = WSQ


#------------------------ Language ------------------------#
# Avoids the masterdata actuator lookup at BaseTestCase.getLanguageList().
local.languages = eng


#------------------------ ID schema required fields ------------------------#
# Stands in for AdminTestUtil.getRequiredField(), which reads the identity
# schema from /v1/masterdata/idschema/latest. Only "individualBiometrics" is
# actually consulted locally -- IdAuthenticationUtil.isTestCaseValidForExecution
# checks for it before every demo / bio / eKYC / multi-factor test, and a null
# list there throws NullPointerException instead of skipping cleanly.
local.requiredFields = individualBiometrics,firstName,lastName,dateOfBirth,gender,phone,email


#------------------------ Certificate root ------------------------#
# Kernel.properties defaults authCertsPath to the Linux container path
# /home/mosip/authcerts. ConfigManager.resolveCertsRootDir() returns it verbatim
# whenever it is non-empty, so on Windows the Mock SBI ends up looking for its
# device keystores under \home\mosip\authcerts\... and fails with
# "Failed to load keystore into local cache". Every capture then returns an
# empty "data" and the whole biometric map stays empty.
#
# Left blank, resolveCertsRootDir() falls back to java.io.tmpdir/AUTHCERTS,
# which is where AdminTestUtil.getKeysDirPath() puts the keys on Windows and
# where LocalRunBootstrap installs the partner keystores.
authCertsPath =


#------------------------ Local run behaviour ------------------------#
# Skip the cert-data delete queries against mosip_keymgr / mosip_master, which
# do not exist locally, and against mosip_ida, which would delete the seeded
# partner and policy rows that init.sql created.
local.skipDbCleanup = true

# The mock-SMTP WebSocket listener is not part of the local stack.
local.skipOtpListener = true


#------------------------ Generic ------------------------#
# Verbose output for local debugging.
enableDebug         = yes
xssProtectionCheck  = no
reportIgnoredTestCases   = yes
reportKnownIssueTestCases = yes

# An Auth capture binds its GCM tag to the transactionId, and the EkycBio yml
# hardcodes 1234567890 while BioAuth uses $TRANSACTIONID$. Pinning the id lets a
# single startup capture satisfy both. Unset (env runs) keeps a random id.
transactionId = 1234567890
