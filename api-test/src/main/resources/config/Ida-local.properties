local.skipTestCases = auth_MultiFactorAuth_Biometric_Face_With_Valid_NOAUTH_no_resident_token_uin_Pos,\
  auth_BlockHotlistAPI_when_expiry_time_old_incorrect,\
  auth_BlockHotlistStatus_ofUIN_valid_sid


