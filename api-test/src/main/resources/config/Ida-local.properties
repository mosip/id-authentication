# with a "Service not deployed" message, so the report counts them as Ignored.
#   - MultiFactorAuth NOAUTH: expects a gateway to reject a request with no
#     resident token; there is no gateway locally.
#   - HotlistAPI_05 (invalid expiry): expects the hotlist service's own input
#     validation error ADM-HTL-002; the hotlist stub does not validate input.
