#=============================================================================#
#  LOCAL RUN OVERLAY  --  read ONLY when localRun is enabled                   #
#-----------------------------------------------------------------------------#
#  This file is layered on top of Kernel.properties + Ida.properties by        #
#  IdAuthConfigManager.init(). It is completely inert unless local run mode is #
#  switched on, so an environment run is unaffected by anything in here.       #
#                                                                              #
#  Enable with any one of:                                                     #
#     -DlocalRun=yes          (JVM arg -- easiest for IDE / jar runs)          #
#     localRun=yes            (environment variable)                           #
#     localRun = yes          (in Ida.properties)                              #
#                                                                              #
#  Target stack: authentication/local-dev-setup (MOSIP-44476)                  #
#=============================================================================#


#------------------------ Local endpoints ------------------------#
# Pass -Denv.endpoint=http://localhost on the command line.
#
# The endpoint deliberately carries no port: the rig derives its certificate
# directory name and the request domainUri from the endpoint host. Without a
# port REST-Assured calls port 8080, so a local TCP relay forwards 8080 to the
# authentication-service on 8090 (see the "Local Run Mode" section of the README).
#
# On develop-1764 the OTP service is merged into authentication-service, so a
# single upstream serves /auth, /otp, /kyc and /kyc-exchange.

# Keycloak token endpoint is stubbed by the local WireMock container.
keycloak-external-url = http://localhost:8082

# IDA's own actuator serves the same config-server properties that the rig
# would otherwise read from the masterdata actuator. Repointing this removes
# the masterdata dependency for the language lookup with no code change.
actuatorMasterDataEndpoint = /idauthentication/v1/actuator/env


#------------------------ Local database ------------------------#
# Only mosip_ida exists in the local compose stack.
db-server         = localhost
db-port           = 5455
db-su-user        = postgres
postgres-password = mosip123
audit_url         = jdbc:postgresql://localhost:5455/mosip_ida
partner_url       = jdbc:postgresql://localhost:5455/mosip_ida


#------------------------ Services that are NOT deployed locally ------------------------#
# Consumed by ConfigManager.isInServiceNotDeployedList(). Suppresses health
# checks and marks dependent test cases as ignored rather than failed.
# hotlist is not listed: its block/unblock APIs have WireMock stand-ins, so the
# env hotlist tests run (see mosip_components_base_urls below).
servicesNotDeployed = idrepo,idrepository,resident,pms,partner,partnermanager,policymanager,masterdata,idgenerator,esignet,regproc,prereg,auditmanager,authmanager,keymanager,credentialservice,credentialrequest,datashare,syncdata


#------------------------ OTP ------------------------#
# The local WireMock otpmanager stub returns a fixed OTP, so the rig can use
# the pre-configured OTP path and skip the mock-SMTP WebSocket listener
# entirely. This hook already exists in apitest-commons
# (NotificationListener.getOtp), so no code change is required.
usePreConfiguredOtp = true
preconfiguredOtp    = 111111


#------------------------ Seeded partner identity ------------------------#
# These three values are what the rig would normally obtain by calling
# partner-management (create partner -> map policy -> generate api key) and
# policy-manager. They are already seeded by
# local-dev-setup/docker-compose/init.sql, so local mode reads them from here
# instead of making those ~11 HTTP calls.
#
# KEEP IN SYNC WITH: local-dev-setup/docker-compose/init.sql
#   ida.misp_license_data.license_key
#   ida.partner_data.partner_id
#   ida.partner_mapping.api_key_id / policy_id
local.partner.mispLicKey = vM1BA8RosNt3kemNGpsneYgcelZwNmsOoKJQgMm92DltqtJh4p
local.partner.id         = auth_v1z0816154432
local.partner.apiKey     = 198833

# The seeded stack has a single partner. The eKYC tests reuse it.
local.partner.ekyc.id     = auth_v1z0816154432
local.partner.ekyc.apiKey = 198833

# Edited-policy partner mapping (LocalPartnerSeeder). The environment run
# creates it through PMS before the suite; locally it is upserted straight into
# the IDA DB on every run, from config/AuthPolicyUpdateAllowedAuthTypes.json.
local.db.url      = jdbc:postgresql://localhost:5455/mosip_ida
local.db.user     = postgres
local.db.password = mosip123
local.policy.updated.id          = local_pol_updated

# Temporary VID auth-req-07-vid-1time (8948612871402917). IDA decrements its
# transaction_limit per use and deletes the row when spent, so the row is
# backed up once (apitest_local.identity_cache_backup) and restored with this
# limit on every run. Value is the identity_cache.id prefix of that VID.
local.tempVid.idPrefix         = 7B8042E2
local.tempVid.transactionLimit = 1


#------------------------ Seeded certificates ------------------------#
# IDA's encryption certificate. Replaces the call to
# /idauthentication/v1/internal/getCertificate, which is served by
# authentication-internal-service and is not part of the local stack.
local.certs.idaPartner = config/local/ida-partner-local.cer

# The partner signing key. IDA verifies the JWS on every auth request against
# ida.partner_data.certificate_data; this keystore holds the matching private
# key. Re-packaged at bootstrap into the alias/password the rig's KeyMgrUtil
# expects, so the alias and password below are those of the SOURCE keystore.
local.certs.p12         = config/local/partner-mosip-signed.p12
local.certs.p12Password = 1234
local.certs.p12Alias    = partner-cn


#------------------------ Seeded prerequisite ids ------------------------#
# Replaces the 22-test prerequisite suite (idrepo / resident / idgenerator).
local.seed.idFile = config/local/seed-ids.properties


#------------------------ Mock SBI capture purpose ------------------------#
# Must match the purpose the Mock SBI is started with. MDSClient sends this as
# the capture request "purpose"; a mismatch makes the device return an empty
# payload rather than an error.
#
# Auth is what IDA authentication needs. Registration-purpose captures exist to
# populate an identity through idrepo, which local runs skip - and Registration
# asks for slap fingers and both irises, so it fails on more modalities.
local.mds.purpose = Auth

# Opt-in list of finger subtypes to capture separately (BiometricDataProvider.
# regenBiometricViaMDS), each with its own standalone-valid hash. All 10 are
# listed to find out which one (if any) is byte-identical to what the primary
# identity was actually enrolled with - the mock SDK's finger comparison
# (MatchService.compareFingerprints) is an exact hash match, not a similarity
# score, so only the literal enrolled sample can ever pass. Unset means the
# single-default-capture behaviour every other caller (env included) already
# had.
local.bio.fingerSubTypes = Left Thumb,Left IndexFinger,Left MiddleFinger,Left RingFinger,Left LittleFinger,Right Thumb,Right IndexFinger,Right MiddleFinger,Right RingFinger,Right LittleFinger

# Same idea for iris (BiometricDataProvider.regenBiometricViaMDS): the Auth
# single-iris device exposes one deviceSubId, so without this only Right is
# ever captured. Each listed eye gets its own capture call.
local.bio.irisSubTypes = Right,Left

# IDA rejects a biometric timestamp older than 120 seconds, and each capture is
# replayed with its own timestamp. Redo the capture once it is this many seconds
# old, so a long (regression) run does not fail every biometric auth.
local.bio.refreshAfterSeconds = 100

# This IDA has no /internal/encrypt helper, so a bioValue that did not come from
# a capture (the invalid-bioValue tests) is encrypted by the rig itself against
# the same IDA-FIR certificate the Mock SBI uses (served by the WireMock stub).
# The titleFromAdmin tests resolve a title code through masterdata; locally that is
# the same WireMock stub IDA reads its titles from.
local.masterdata.titleUrl = http://localhost:8082/v1/masterdata/title

local.bio.encryptCertUrl =http://localhost:8082/idauthentication/v1/internal/getCertificate?applicationId=IDA&referenceId=IDA-FIR

# Services that do not run locally but whose APIs have a WireMock stand-in on
# 8082 (master_data_mock_service). The rig rewrites the host of every call to
# these components (ConfigManager / GlobalMethods.getUpdatedEndPointURL), so the
# env ymls run unchanged against the stubs:
#   idrepository : /idrepository/v1/vid/deactivate and /vid/reactivate
#                  (DeactivateVIDs / ReactivateVIDs, env ymls and class)
#   resident     : /resident/v1/auth-lock-unlock (AuthLockNewLocal / AuthUnLockNewLocal,
#                  in place of the deprecated /resident/v1/req/auth-lock, /req/auth-unlock)
#   idrepository : also /idrepository/v1/identity/ (UpdateIdentityForUin, UIN
#                  deactivate / activate of 8354720784)
#   resident     : also /resident/v1/vid/{vid} (RevokeVID, VID 8021750691607687)
#   hotlist      : /v1/hotlist/block and /unblock (BlockHotlist, BlockPartnerId and
#                  their unblocks; stubs for Sanjay's UIN/VID, the seeded partner, its
#                  MISP key and API key, and the MOSIP mock SBI device / provider)
#   authmanager  : token for the role those env tests use
# Each stub posts its event to IDA after it answers; settleMillis is the pause
# AuthLockUnlockNewLocal leaves after each call so IDA has applied it.
mosip_components_base_urls = idrepository=localhost:8082;resident=localhost:8082;authmanager=localhost:8082;hotlist=localhost:8082
# Modules whose host mosip_components_base_urls may rewrite: the apitest-commons
# default list (GlobalMethods.module_name) plus hotlist, which the default lacks.
moduleNamePattern = (mimoto|certify|signup|partnermanager|preregistration|resident|residentmobileapp|masterdata|esignet|idgenerator|policymanager|idauthentication|idrepository|auditmanager|authmanager|keymanager|mock-identity-system|credentialservice|credentialrequest|hotlist)
local.mock.settleMillis = 2000
# Endpoint prefixes after which the generic POST/PATCH test classes also wait
# local.mock.settleMillis (IdAuthenticationUtil.settleAfterLocalMockCall): the
# mocks post their event to IDA on their own thread, so back-to-back calls such as
# deactivate -> activate or block -> unblock can otherwise reach IDA out of order.
local.mock.settleEndpoints = /idrepository/,/resident/v1/vid/,/v1/hotlist/

# Literal values in env ymls replaced in local runs (from=>to;...), applied to the
# requests of SimplePostForAutoGenId (hotlist block / unblock). The env hotlist
# tests block the one Logitech device every env capture uses; locally the
# captures come from the MOSIP mock SBI (one device per modality, one provider),
# so the block goes to that provider and covers every modality like the env one.
# The "571203" device of HotlistAPI_11 / Unblock_07 goes to the mock SBI's single
# finger device (SerialNo 1234567990, Make MOSIP, Model SINGLE01), which has its own
# hotlist stub (matched with its quotes so no other value is touched).
local.literalReplacements = 78467171Logitech4d36e96c-e325-11ce-bfc1-08002be10318=>MOSIPMOSIP.PROXY.SBI;"571203"=>"1234567990MOSIPSINGLE01"


